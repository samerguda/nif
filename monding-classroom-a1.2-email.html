<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- هذا الوسم ضروري جداً لجعل الصفحة متجاوبة مع شاشات الهواتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسخ البريد الإلكتروني Mondeling - Wouter - My email google classroom</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية مرنة تتكيف مع حجم الشاشة */
        .email-container {
            display: flex;
            flex-wrap: wrap; /* يسمح بنزول الزر لسطر جديد في الشاشات الضيقة جداً */
            align-items: center;
            justify-content: center;
            gap: 12px; /* مسافة متساوية بين الإيميل والزر */
            background-color: #ffffff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            width: fit-content;
        }

        #email-text {
            font-size: 16px;
            color: #202124;
            word-break: break-all; /* يمنع خروج النص الطويل عن إطار الشاشة في الهواتف */
            text-align: center;
            direction: ltr; /* لضمان عرض الإيميل الإنجليزي بشكل صحيح */
        }

        .copy-btn {
            background-color: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: #e8eaed;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: #ceead6;
            border-color: #34a853;
            color: #0d652d;
        }

        /* تنسيقات خاصة بشاشات الهواتف الصغيرة (أقل من 480 بكسل) */
        @media (max-width: 480px) {
            .email-container {
                flex-direction: column;
                width: 100%;
                padding: 20px 15px;
            }

            #email-text {
                font-size: 15px;
            }

            .copy-btn {
                width: 100%; /* جعل الزر بعرض البطاقة لسهولة الضغط عليه بالإبهام */
                padding: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="email-container">
        <span id="email-text">samer.alsaadni@cursist.hetcvo.be</span>
        <button class="copy-btn" id="copyButton">نسخ</button>
    </div>

    <script>
        document.getElementById('copyButton').addEventListener('click', function() {
            var email = document.getElementById('email-text').innerText;
            var button = this;

            navigator.clipboard.writeText(email).then(function() {
                button.innerText = 'تم النسخ!';
                button.classList.add('copied');

                setTimeout(function() {
                    button.innerText = 'نسخ';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(function(err) {
                console.error('فشل في النسخ: ', err);
                alert('حدث خطأ أثناء محاولة النسخ.');
            });
        });
    </script>

</body>
</html>
