
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva Team Work - Frostique</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f7ff, #f5f0ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(40, 90, 130, 0.12);
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #174a68;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f3f9fc;
            border: 1px solid #e1eef5;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 14px;
            text-align: left;
        }

        .number {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #d7efff;
            color: #174a68;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .name {
            color: #253746;
            font-size: 19px;
            font-weight: bold;
        }

        .footer {
            margin-top: 28px;
            color: #8494a3;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">❄️</div>

        <h1>Frostique</h1>
        <p class="subtitle">Team Work & Collaboration</p>

        <div class="team-member">
            <div class="number">1</div>
            <div class="name">Eva</div>
        </div>

        <div class="team-member">
            <div class="number">2</div>
            <div class="name">Sil</div>
        </div>

        <div class="footer">
            Together We Make It Happen ❄️
        </div>
    </div>

</body>
</html>
