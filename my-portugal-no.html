<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portugal Phone Details</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-button {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(37, 99, 235, 0.9));
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            transform: translateY(-2px);
        }

        .glass-button:active {
            transform: translateY(0);
        }

        /* Ambient Glow Background */
        .bg-glow-1 {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .bg-glow-2 {
            background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between items-center p-4 relative overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Background Ambient Lights -->
    <div class="fixed top-10 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-glow-1 pointer-events-none rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="fixed bottom-10 right-10 w-[400px] h-[400px] bg-glow-2 pointer-events-none rounded-full blur-3xl"></div>

    <!-- Top Live Time & Date Banner -->
    <header class="w-full max-w-md mt-2 mb-6">
        <div class="glass-card rounded-2xl p-4 text-center border border-white/10 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-blue-500/10 via-purple-500/10 to-transparent pointer-events-none"></div>
            
            <div class="flex justify-center items-center gap-2 text-xs font-semibold tracking-wider text-blue-400 uppercase mb-1">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Live Status & Time</span>
            </div>

            <!-- Dynamic Clock -->
            <div id="live-time" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white drop-shadow-md">
                --:--:-- --
            </div>
            <!-- Dynamic Date -->
            <div id="live-date" class="text-xs sm:text-sm font-medium text-slate-400 mt-1">
                Loading date...
            </div>
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center">
        <div class="glass-card rounded-3xl p-6 sm:p-8 relative shadow-2xl backdrop-blur-2xl animate-float">
            
            <!-- Flag / Country Header -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-600 via-red-600 to-yellow-500 p-[2px] shadow-lg">
                        <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center text-xl">
                            🇵🇹
                        </div>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white tracking-wide">Portugal Contact</h1>
                        <p class="text-xs text-slate-400">Personal Direct Line</p>
                    </div>
                </div>
                <span class="px-3 py-1 text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
                    Active
                </span>
            </div>

            <!-- Primary Phone Number Display -->
            <div class="text-center my-6">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Phone Number</p>
                <div class="inline-block group">
                    <a href="tel:+351912123741" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-white hover:from-blue-300 hover:to-indigo-200 transition-all tracking-wider">
                        +351 912 123 741
                    </a>
                </div>
            </div>

            <!-- Interactive Action Buttons (Copy & Call) -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <!-- Copy Number Button -->
                <button onclick="copyToClipboard('+351912123741', 'Phone number copied!')" 
                        class="glass-button w-full py-3 px-4 rounded-xl font-semibold text-sm text-white flex items-center justify-center gap-2 group">
                    <i class="fa-regular fa-copy group-hover:scale-110 transition-transform"></i>
                    <span>Copy Number</span>
                </button>

                <!-- Direct Call Button -->
                <a href="tel:+351912123741" 
                   class="w-full py-3 px-4 rounded-xl font-semibold text-sm text-white bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 flex items-center justify-center gap-2 transition-all hover:border-blue-500/50">
                    <i class="fa-solid fa-phone text-emerald-400"></i>
                    <span>Call Now</span>
                </a>
            </div>

            <!-- Information Grid (Clean Format & PIN) -->
            <div class="space-y-3 pt-2">
                
                <!-- Unformatted Number Box -->
                <div class="bg-slate-900/60 rounded-xl p-3 border border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-hashtag text-blue-400 text-sm w-4 text-center"></i>
                        <div>
                            <span class="text-[11px] text-slate-400 block">Plain Format</span>
                            <span class="text-sm font-mono font-medium text-slate-200">351912123741</span>
                        </div>
                    </div>
                    <button onclick="copyToClipboard('351912123741', 'Plain number copied!')" class="p-2 text-slate-400 hover:text-white transition-colors">
                        <i class="fa-regular fa-clone text-xs"></i>
                    </button>
                </div>

                <!-- PIN Code Box -->
                <div class="bg-gradient-to-r from-amber-500/10 via-slate-900/60 to-slate-900/60 rounded-xl p-3 border border-amber-500/20 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-key text-amber-400 text-sm w-4 text-center"></i>
                        <div>
                            <span class="text-[11px] text-amber-400/80 font-medium block">PIN Code</span>
                            <span id="pin-display" class="text-base font-mono font-bold tracking-widest text-amber-300">1877</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="togglePinVisibility()" title="Toggle visibility" class="p-2 text-slate-400 hover:text-amber-400 transition-colors">
                            <i id="pin-eye-icon" class="fa-regular fa-eye text-xs"></i>
                        </button>
                        <button onclick="copyToClipboard('1877', 'PIN code copied!')" title="Copy PIN" class="p-2 text-slate-400 hover:text-amber-400 transition-colors">
                            <i class="fa-regular fa-copy text-xs"></i>
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        <p>Portugal Line Details &bull; Quick Access</p>
    </footer>

    <!-- Toast Notification Message Box -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-semibold px-5 py-3 rounded-full border border-blue-500/30 shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-message">Copied to clipboard!</span>
    </div>

    <script>
        // Real-time Dynamic Clock & Date Function
        function updateDateTime() {
            const now = new Date();

            // English Time Options
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            };
            
            // English Date Options
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };

            const formattedTime = now.toLocaleTimeString('en-US', timeOptions);
            const formattedDate = now.toLocaleDateString('en-US', dateOptions);

            document.getElementById('live-time').innerText = formattedTime;
            document.getElementById('live-date').innerText = formattedDate;
        }

        // Run clock every second
        setInterval(updateDateTime, 1000);
        updateDateTime(); // Initial call

        // Safe Clipboard Copying
        function copyToClipboard(text, successMsg) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast(successMsg);
        }

        // Show Toast Notification
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Toggle PIN Code Visibility
        let isPinVisible = true;
        function togglePinVisibility() {
            const pinDisplay = document.getElementById('pin-display');
            const eyeIcon = document.getElementById('pin-eye-icon');
            
            if (isPinVisible) {
                pinDisplay.innerText = '••••';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pinDisplay.innerText = '1877';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
            isPinVisible = !isPinVisible;
        }
    </script>
</body>
</html>
