<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agristo Clesning المغربي  </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h3 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-call {
            background-color: #007bff;
        }
        .btn-call:hover {
            background-color: #0056b3;
        }
        .btn-whatsapp {
            background-color: #25d366;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>التواصل السريع</h3>
        <p>المغربي - مصنع أجريستو (Agristo)</p>
        
        <div class="btn-container">
            <!-- زر الاتصال المباشر -->
            <a href="tel:+32493737739" class="btn btn-call">
                📞 اتصال مباشر
            </a>

            <!-- زر واتساب مع المفتاح البلجيكي وإرسال رسالة جاهزة -->
            <a href="https://wa.me/32493737739?text=السلام%20عليكم،%20بخصوص%20العمل%20في%20مصنع%20أجريستو" target="_blank" class="btn btn-whatsapp">
                💬 مراسلة عبر واتساب
            </a>
        </div>
    </div>

</body>
</html>
