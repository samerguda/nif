<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الأصدقاء</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 {
            margin: 0;
            color: #333;
        }
        .btn-copy-all {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(108, 92, 231, 0.3);
        }
        .btn-copy-all:hover {
            background-color: #5b4bc4;
        }
        .btn-copy-all:active {
            transform: scale(0.98);
        }
        .friends-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .friend-item {
            background-color: #ffffff;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .friend-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d3436;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            text-decoration: none;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #1ebc57;
        }
        .btn-messenger {
            background-color: #0084FF;
        }
        .btn-messenger:hover {
            background-color: #006bde;
        }
        
        /* تنبيه النجاح */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>قائمة الأصدقاء</h2>
            <button class="btn-copy-all" onclick="copyAllNames()">📋 نسخ جميع الأسماء</button
