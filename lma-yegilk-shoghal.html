<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اكل الشغل</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #fdf6e3 0%, #f0e6d2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    padding: 30px 24px;
    max-width: 520px;
    width: 100%;
  }

  h1 {
    text-align: center;
    color: #d35400;
    font-size: clamp(22px, 6vw, 28px);
    margin-bottom: 8px;
    position: relative;
  }

  h1::after {
    content: '';
    display: block;
    width: 70px;
    height: 3px;
    background: #f39c12;
    border-radius: 3px;
    margin: 12px auto 0;
  }

  ul {
    list-style: none;
    margin-top: 24px;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fffaf2;
    border: 1px solid #f3e5d0;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: clamp(15px, 4vw, 17px);
    color: #4a3728;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }

  li:hover {
    transform: translateX(-6px);
    box-shadow: 0 4px 15px rgba(211,84,0,0.15);
    background: #fff3e0;
  }

  .num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #f39c12, #e67e22);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 15px;
  }

  /* موبايل */
  @media (max-width: 480px) {
    body { padding: 12px; }
    .card { padding: 22px 16px; border-radius: 16px; }
    li { padding: 12px; gap: 10px; }
    .num { width: 30px; height: 30px; font-size: 13px; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>اكل الشغل</h1>
    <ul>
      <li><span class="num">١</span> سندوتش جمبري</li>
      <li><span class="num">٢</span> سندوتش تونة حار ذرة مايونيز</li>
      <li><span class="num">٣</span> سندوتش بيض اومليت بجبنة موزريلا</li>
      <li><span class="num">٤</span> بيض مسلوق مهروس ذرة افوكادو</li>
      <li><span class="num">٥</span> بركوكوش حراق</li>
      <li><span class="num">٦</span> رز كبسة</li>
      <li><span class="num">٧</span> جمبري رز</li>
    </ul>
  </div>

</body>
</html>
