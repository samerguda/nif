<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعدادات الشغل - اللوحة الشخصية</title>
    <!-- استخدام Tailwind CSS للتصميم الاحترافي والسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خط عربي أنيق (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .completed { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- حاوية التطبيق الرئيسية -->
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- رأس الصفحة مع عداد الوقت والتاريخ الدايناميك -->
        <header class="flex flex-col md:flex-row justify-between items-center border-b border-slate-800 pb-6 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-blue-400">⚡ استعدادات الشغل واليوم</h1>
                <p class="text-slate-400 text-sm mt-1">تابع تجهيزاتك وخطواتك بدقة لتبدأ يومك بكل تركيز</p>
            </div>
            <div id="clock-container" class="bg-slate-800/80 border border-slate-700/50 px-4 py-3 rounded-xl text-center min-w-[200px]">
                <div id="live-time" class="text-xl font-bold text-emerald-400">00:00:00</div>
                <div id="live-date" class="text-xs text-slate-400 mt-1">جاري تحميل التاريخ...</div>
            </div>
        </header>

        <!-- قائمة الاستعدادات -->
        <main class="space-y-6">
            
            <!-- القسم الرئيسي: استعدادات الشغل -->
            <div>
                <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                    قائمة الاستعدادات الأساسية
                </h2>
                
                <div class="space-y-2.5">
                    <!-- 1 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">١- اختيار ملابس</span>
                    </label>
                    
                    <!-- 2 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٢- كوي ملابس</span>
                    </label>
                    
                    <!-- 3 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٣- تحضير أكل</span>
                    </label>
                    
                    <!-- 4 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٤- نيم الشعر</span>
                    </label>
                    
                    <!-- 5 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٥- ودوون (ديودرنت)</span>
                    </label>
                    
                    <!-- 6 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٦- حط اللبس على الارض</span>
                    </label>
                    
                    <!-- 7 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٧- كتابة أوراق المذاكرة</span>
                    </label>
                    
                    <!-- 8 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٨- شنطة (<span class="text-blue-300 font-semibold">أكل:</span> بيبسي و شيبسي و ساندويتش - علبة أكل)</span>
                    </label>
                    
                    <!-- 9 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">٩- شحن الفيتس</span>
                    </label>
                    
                    <!-- 10 -->
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">١٠- حجز تذاكر قطار</span>
                    </label>
                </div>
            </div>

            <!-- روتين الصبح -->
            <div class="pt-4 border-t border-slate-800">
                <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    ١١- الصبح (روتين الانطلاق)
                </h2>
                
                <div class="space-y-2.5">
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">حمام</span>
                    </label>
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">وضوء</span>
                    </label>
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">لبس</span>
                    </label>
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">شنطة</span>
                    </label>
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">مفتاح سيارة</span>
                    </label>
                    <label class="flex items-center gap-3 bg-slate-800/50 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition border border-slate-800/80">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer" onchange="toggleTask(this)">
                        <span class="text-sm md:text-base">أخذ الفيتس 🚀</span>
                    </label>
                </div>
            </div>

        </main>

        <!-- تذييل الصفحة -->
        <footer class="mt-8 text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
            تم إعداد هذا الكود خصيصاً لتنظيم مهامك بكفاءة عالية.
        </footer>
    </div>

    <!-- الكود البرمجي للوقت والتاريخ والتفاعل -->
    <script>
        function updateDateTime() {
            const now = new Date();
            
            // تحديث الوقت (تنسيق 24 ساعة مع الثواني)
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // تحديث التاريخ بالعربي
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('ar-EG', options);

            document.getElementById('live-time').innerText = timeString;
            document.getElementById('live-date').innerText = dateString;
        }

        // تشغيل العداد وتحديثه كل ثانية
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // دالة شطب العنصر عند وضع علامة صح
        function toggleTask(checkbox) {
            const span = checkbox.nextElementSibling;
            if (checkbox.checked) {
                span.classList.add('completed', 'text-slate-500');
            } else {
                span.classList.remove('completed', 'text-slate-500');
            }
        }
    </script>
</body>
</html>
