<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Harelbeke - Google Maps Style</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Container matching Google Maps Place Sheet */
        .place-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Header Handle Bar */
        .handle-bar {
            width: 36px;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
            margin: 10px auto 14px;
        }

        /* Title & Top Bar */
        .header-content {
            padding: 0 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .place-title {
            font-size: 24px;
            font-weight: 500;
            color: #1e293b;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            cursor: pointer;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
            gap: 24px;
        }

        .tab {
            padding-bottom: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            position: relative;
        }

        .tab.active {
            color: #0284c7;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #0284c7;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
        }

        /* Dynamic Real-time Clock Banner */
        .live-clock-banner {
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .clock-time {
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Main Scrollable Content Area */
        .card-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Know before you go banner */
        .info-box {
            background-color: #f5f3ff;
            border-radius: 16px;
            padding: 16px;
        }

        .info-box-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge-new {
            background-color: #dcfce7;
            color: #15803d;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .avatars-group {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            margin-left: -6px;
            object-fit: cover;
        }

        .avatar-count {
            font-size: 11px;
            color: #475569;
            margin-left: 4px;
        }

        .bullet-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13.5px;
            color: #334155;
            line-height: 1.4;
        }

        .bullet-item:last-child {
            margin-bottom: 0;
        }

        .circle-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4338ca;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* Opening Hours Section */
        .hours-card {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 16px;
        }

        .hours-header {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .status-tag {
            font-weight: 700;
            font-size: 15px;
        }

        .status-tag.closed {
            color: #dc2626;
        }

        .status-tag.open {
            color: #16a34a;
        }

        .hours-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 36px;
        }

        .hours-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #334155;
        }
