<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المهام</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 0.2s, transform 0.1s;
    }

    .item:hover {
      border-color: #475569;
    }

    .text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .copy-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    .copy-btn:active {
      transform: scale(0.96);
    }

    .copy-btn.copied {
      background-color: var(--success);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="list" id="list"></div>
  </div>

  <script>
    const items = [
      "🪪 استلام Orange Card ومتابعة الإقامة.",
      "💼 التسجيل في VDAB.",
      "🇳🇱 Dutch A2 — Live Online.",
      "💰 البحث عن شغل مؤقت.",
      "👷 البحث عن وظيفة Mechanical/HVAC Engineer.",
      "🤝 Integration / Inburgering.",
      "🚗 الحصول على رخصة قيادة بلجيكية.",
      "💻 تطوير مهارات الكمبيوتر/IT.",
      "📄 تقييم الشهادات الهندسية.",
      "🎓 الحصول على VCA.",
      "🏦 فتح حساب بنكي بلجيكي.",
      "📱 Itsme + eID للخدمات الحكومية.",
      "🩺 اختيار طبيب عائلة (Huisarts).",
      "🧾 تنظيم الضرائب البلجيكية.",
      "📄 تجهيز CV بلجيكي + LinkedIn.",
      "🤝 بناء شبكة علاقات مهنية."
    ];

    const listContainer = document.getElementById('list');

    items.forEach((text, index) => {
      const itemEl = document.createElement('div');
      itemEl.className = 'item';

      const textEl = document.createElement('span');
      textEl.className = 'text';
      textEl.textContent = `${index + 1}. ${text}`;

      const btnEl = document.createElement('button');
      btnEl.className = 'copy-btn';
      btnEl.textContent = 'نسخ';
      btnEl.addEventListener('click', () => copyText(text, btnEl));

      itemEl.appendChild(textEl);
      itemEl.appendChild(btnEl);
      listContainer.appendChild(itemEl);
    });

    function copyText(text, button) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = button.textContent;
        button.textContent = 'تم النسخ ✓';
        button.classList.add('copied');

        setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove('copied');
        }, 1500);
      });
    }
  </script>
</body>
</html>
