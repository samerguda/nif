<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات الحساب البنكي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .bank-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 440px;
            width: 100%;
        }
        .bank-header {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .info-group {
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .label {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }
        .content-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .value {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            word-break: break-all;
        }
        .iban-style {
            font-family: monospace;
            direction: ltr;
            text-align: right;
        }
        .btn-copy {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s ease;
        }
        .btn-copy:hover {
            background-color: #0056b3;
        }
        .btn-copy.copied {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <div class="bank-card">
        <div class="bank-header">🏦 تفاصيل الحساب البنكي</div>
        
        <!-- البنك -->
        <div class="info-group">
            <div class="label">البنك</div>
            <div class="content-row">
                <div class="value" id="bankName">بنك البلاد</div>
                <button class="btn-copy" onclick="copyText('bankName', this)">نسخ</button>
            </div>
        </div>

        <!-- الاسم بالعربية -->
        <div class="info-group">
            <div class="label">اسم المستفيد (بالعربية)</div>
            <div class="content-row">
                <div class="value" id="arabicName">محمد نعيم عطيه السيد</div>
                <button class="btn-copy" onclick="copyText('arabicName', this)">نسخ</button>
            </div>
        </div>

        <!-- الاسم بالإنجليزية -->
        <div class="info-group">
            <div class="label">اسم المستفيد (بالإنجليزية)</div>
            <div class="content-row">
                <div class="value" id="englishName" style="direction: ltr; text-align: right;">mohamed naim atia elsayed</div>
                <button class="btn-copy" onclick="copyText('englishName', this)">نسخ</button>
            </div>
        </div>

        <!-- رقم الآيبان -->
        <div class="info-group">
            <div class="label">رقم الآيبان (IBAN)</div>
            <div class="content-row">
                <div class="value iban-style" id="ibanText">SA3015000900129645090002</div>
                <button class="btn-copy" onclick="copyText('ibanText', this)">نسخ</button>
            </div>
        </div>
    </div>

    <script>
        function copyText(elementId, btnElement) {
            const text = document.getElementById(elementId).innerText.trim();
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "تم النسخ ✓";
                btnElement.classList.add("copied");
                
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove("copied");
                }, 2000);
            }).catch(err => {
                console.error("فشل النسخ: ", err);
            });
        }
    </script>

</body>
</html>
