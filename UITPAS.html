<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة التواصل والحجز</title>
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 24px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e5e7eb;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary-color);
            border: 3px solid var(--primary-color);
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .location-info {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            grid-column: span 2;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }

        .btn-call {
            background-color: #10b981;
            color: white;
        }

        .btn-email {
            background-color: #ea4335;
            color: white;
        }

        .btn-map {
            background-color: #4b5563;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* نافذة الحجز المصغرة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            text-align: right;
            position: relative;
        }

        .close-btn {
            position: absolute;
            left: 16px;
            top: 16px;
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #374151;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الصورة الشخصية / الشعار -->
        <div class="profile-img">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- الاسم والمسمى الوظيفي -->
        <h2 class="name">سامر السعدني</h2>
        <p class="title">مهندس / تقديم خدمات استشارية</p>

        <!-- الموقع الجغرافي القريب من هاره بيكه -->
        <div class="location-info">
            <i class="fa-solid fa-location-dot" style="color: #ef4444;"></i>
            <span>Harelbeke (قرب Kortrijk)، بلجيكا</span>
        </div>

        <!-- زر الحجز الرئيسي -->
        <button class="btn btn-primary" onclick="openModal()" style="margin-bottom: 12px;">
            <i class="fa-solid fa-calendar-check"></i>
            حجز ميعاد جديد
        </button>

        <!-- أزرار التواصل -->
        <div class="btn-grid">
            <a href="https://wa.me/32000000000" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> واتساب
            </a>
            
            <a href="tel:+32000000000" class="btn btn-call">
                <i class="fa-solid fa-phone"></i> اتصال
            </a>

            <a href="mailto:example@email.com" class="btn btn-email">
                <i class="fa-solid fa-envelope"></i> البريد
            </a>

            <!-- رابط الموقع على الخريطة (هاره بيكه) -->
            <a href="https://maps.google.com/?q=Harelbeke,Belgium" target="_blank" class="btn btn-map">
                <i class="fa-solid fa-map-location-dot"></i> الموقع
            </a>
        </div>
    </div>

    <!-- نافذة حجز الميعاد -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-bottom: 16px; font-size: 18px;">حجز ميعاد</h3>
            
            <form onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" required placeholder="أدخل اسمك">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" required placeholder="04xx xxx xxx">
                </div>
                <div class="form-group">
                    <label>تاريخ الميعاد</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>التوقيت المناسب</label>
                    <select required>
                        <option value="">اختر الوقت</option>
                        <option value="10:00">10:00 صباحاً</option>
                        <option value="14:00">02:00 ظهراً</option>
                        <option value="16:00">04:00 عصراً</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">تأكيد طلب الحجز</button>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
        }

        function handleBooking(e) {
            e.preventDefault();
            alert('تم تقديم طلب الحجز بنجاح! سنتواصل معك عبر الهاتف للتأكيد.');
            closeModal();
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('bookingModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
