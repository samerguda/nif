<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد الامتحانات  13/1/2027 to 20/1/2027</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            max-width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #333;
        }
        .date-text {
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 10px;
            direction: ltr;
            text-align: right;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- الفترة الأولى -->
    <div class="card">
        <h3>الفترة الأولى للامتحان</h3>
        <div class="date-text" id="period1">13/1/2027 to 20/1/2027</div>
        <button onclick="copyToClipboard('period1', this)">نسخ تاريخ الفترة الأولى</button>
    </div>

    <!-- الفترة الثانية -->
    <div class="card">
        <h3>الفترة الثانية للامتحان</h3>
        <div class="date-text" id="period2">22/1/2027 to 29/1/2027</div>
        <button onclick="copyToClipboard('period2', this)">نسخ تاريخ الفترة الثانية</button>
    </div>

    <script>
        function copyToClipboard(elementId, btn) {
            // الحصول على النص المراد نسخه
            const textToCopy = document.getElementById(elementId).innerText;
            
            // استخدام Clipboard API لنسخ النص
            navigator.clipboard.writeText(textToCopy).then(() => {
                // تغيير نص الزر مؤقتاً لتأكيد النسخ
                const originalText = btn.innerText;
                btn.innerText = "تم النسخ! ✓";
                btn.style.backgroundColor = "#007bff";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "#28a745";
                }, 2000);
            }).catch(err => {
                console.error('فشل النسخ: ', err);
            });
        }
    </script>

</body>
</html>
