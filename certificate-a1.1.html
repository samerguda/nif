<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nederlands- Certificate A1.1</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --accent-color: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* Image Display Styling */
        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .image-wrapper {
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Certificate Translation Styling */
        .translation-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .section-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .dual-text {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .dual-text:last-child {
            border-bottom: none;
        }

        .ar {
            text-align: right;
            dir: rtl;
        }

        .nl {
            text-align: left;
            dir: ltr;
            font-family: 'Inter', sans-serif;
            color: #334155;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: #eff6ff;
            color: var(--primary-color);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .highlight {
            font-weight: 700;
            color: var(--primary-color);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>وثيقة ترجمة معتمدة - Certificaat Vertaling</h1>
            <p>المجتمع الفلمنكي - مملكة بلجيكا | Vlaamse Gemeenschap - Koninkrijk België</p>
        </header>

        <div class="main-grid">
            <!-- Left Side: Image Display -->
            <div class="card image-container">
                <div class="section-header" style="width: 100%;">
                    <span class="section-title">الوثيقة الأصلية (Original Document)</span>
                    <span class="badge">صورة الشهادة</span>
                </div>
                <div class="image-wrapper">
                    <img src="image.png" alt="شهادة بلجيكية - Deelcertificaat" onerror="this.src='https://via.placeholder.com/600x800?text=صورة+الشهادة+غير+متوفرة'">
                </div>
            </div>

            <!-- Right Side: Dual Language Translation -->
            <div
